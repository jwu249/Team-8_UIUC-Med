<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIUC Med - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
</head>
<body>
    <svg style="display:none;">
        <symbol id="icon-logo" viewBox="0 0 24 24">
            <path class="logo-svg" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            <path fill="white" d="M11 7h2v3h3v2h-3v3h-2v-3H8v-2h3z"/>
        </symbol>
        <symbol id="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></symbol>
    </svg>

    <nav class="top-nav">
    <div class="nav-logo" onclick="window.location.href='home.html'">
        <svg><use href="#icon-logo"></use></svg> UIUC Med
    </div>
    
    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="map.html">Map</a>
        <a href="#">Services</a>
        <a href="#">Search</a>
        <a href="#">Chart</a>
        <a href="#">API</a>
        <a href="#">Reports</a>
    </div>

    <div class="nav-actions">
        <button class="btn btn-outline" onclick="window.location.href='index.html'" style="padding: 0.4rem 1rem; font-size: 0.85rem;">Sign Out</button>
    </div>
</nav>

    <div class="screen active center-screen" style="background: white;">

        <div class="text-center w-full">
            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">How can we help you today?</h1>
            <p style="font-size: 1.1rem; margin-bottom: 2.5rem;">Describe your symptoms, ask about treatments, or find local specialists.</p>

            <div style="display: flex; justify-content: center; width: 100%;">
                <div class="search-bar-large">
                    <input type="text" placeholder="Ask anything" onkeydown="if(event.key === 'Enter') window.location.href='map.html'">
                    
                    <svg style="color: var(--text-muted); cursor: pointer;" width="20" height="20" onclick="window.location.href='map.html'"><use href="#icon-mic"></use></svg>
                    
                    <div style="display:flex; gap: 2px; height: 16px; align-items: center; cursor: pointer;" onclick="window.location.href='map.html'">
                        <div style="width:2px; height:8px; background:var(--text-muted);"></div>
                        <div style="width:2px; height:16px; background:var(--text-muted);"></div>
                        <div style="width:2px; height:12px; background:var(--text-muted);"></div>
                    </div>
                </div>
            </div>

            <div class="pills-container mt-4">
                <div class="pill-badge" onclick="window.location.href='map.html'">🌡️ Fever</div>
                <div class="pill-badge" onclick="window.location.href='map.html'">🤕 Sore Throat</div>
                <div class="pill-badge" onclick="window.location.href='map.html'">💉 Vaccination</div>
                <div class="pill-badge" onclick="window.location.href='map.html'">📈 Heart Rate</div>
                <div class="pill-badge" onclick="window.location.href='map.html'">😰 Stress</div>
            </div>
        </div>
    </div>
</body>
</html>
